# ========================================
# Super-Controller Versioning Configuration
# ========================================

# Enable API versioning support
super-controller.versioning.enabled=true

# Default API version when none is specified
super-controller.versioning.default-version=v1

# Strategy for determining API version from request
# Options: URI, HEADER, PARAMETER, ACCEPT_HEADER
super-controller.versioning.strategy=URI

# Custom header name (used when strategy=HEADER)
super-controller.versioning.header-name=X-API-Version

# Query parameter name (used when strategy=PARAMETER)
super-controller.versioning.param-name=version

# Media type prefix (used when strategy=ACCEPT_HEADER)
# Example: application/vnd.api.v1+json
super-controller.versioning.media-type-prefix=application/vnd.api

# Add deprecation headers to responses for deprecated API versions
# When true, adds X-API-Deprecated, Sunset, Warning headers
super-controller.versioning.add-deprecation-headers=true

# ========================================
# Example Usage in Controllers
# ========================================
# 
# @ApiVersion(value = "v1", deprecated = true, sunset = "2025-12-31")
# @RestController
# @RequestMapping("/v1/users")
# class UserControllerV1 : SuperController<User, CreateUserRequest, UpdateUserRequest, Long>()
#
# @ApiVersion(value = "v2")
# @RestController
# @RequestMapping("/v2/users")
# class UserControllerV2 : SuperController<User, CreateUserRequest, UpdateUserRequest, Long>()
